<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Create an Account</title>
</head>
<body>
    <h1>Create an account to get started</h1>

    <form action=""method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <ul>
                <li>
                    <label for="Fname">First Name:</label>
                    <input type="text" name="Fname" id="Fname" required>
                </li>
                <li>
                    <label for="Email">Email:</label>
                    <input type="Email" name="E-adress" id="Email" required>
                </li>
                <li>
                    <label for="date_of_birth">Date of Birth:</label>
                    <input type="date" name="date_of_birth" id="date_of_birth">
                </li>
                <li>
                    <label for="address">Address</label>
                    <input type="text" name="address" id="address"required>
                </li>
                <li>
                    <label for="Phone number">Phone number:</label>
                    <input type="tel" name="Phone number" id="Phone number" required>
                </li>
                <li>
                    <p>Gender</p>
                    <input type="radio" name="Gender" id="male">
                    <label for="male">Male</label> <br>

                    <input type="radio" name="Gender" id="female">
                    <label for="female">Female</label> <br>
                    
                </li>
                <li>
                    <p>Marital Status</p>
                    <input type="radio" name="Marital Status" id="single">
                    <label for="single">Single</label> <br>

                    <input type="radio" name="Marital Status" id="married">
                    <label for="married">Married</label> <br>

                    <input type="radio" name="Marital Status" id="divorced">
                    <label for="divorced">Divorced</label> <br>

                    <input type="radio" name="Marital Status" id="widowed">
                    <label for="widowed">Widowed</label> <br>
                </li>
                <li>
                    <p>Race</p>
                    <input type="radio" name="Race" id="black">
                    <label for="black">Black</label> <br>

                    <input type="radio" name="Race" id="white">
                    <label for="white">White</label> <br>

                    <input type="radio" name="Race" id="asian">
                    <label for="asian">Asian</label> <br>

                    <input type="radio" name="Race" id="hispanic">
                    <label for="hispanic">Hispanic</label> <br>
                </li>
                <li>
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password" required>
                </li>
                <li>
                    <span>State of Origin</span>
                    <select name="State of Origin" id="state" title="Select your state">
                        <optgroup label="South East">
                            <option value="Abia">Abia</option>
                            <option value="Adamawa">Adamawa</option>
                            <option value="Akwa Ibom">Akwa Ibom</option>
                            <option value="Anambra">Anambra</option>
                            <option value="Bauchi" selected>Bauchi</option>
                        </optgroup>
                        <optgroup label="South West">
                            <option value="Bayelsa">Bayelsa</option>
                            <option value="Benue">Benue</option>
                            <option value="Borno">Borno</option>
                            <option value="Cross River">Cross River</option>
                            <option value="Delta">Delta</option>
                        </optgroup>
                        <optgroup label="South South">
                            <option value="Ebonyi">Ebonyi</option>
                            <option value="Edo">Edo</option>
                            <option value="Ekiti">Ekiti</option>
                            <option value="Enugu">Enugu</option>
                            <option value="FCT">FCT</option>
                        </optgroup>
                    </select>

                </li>
            </ul>

        </fieldset>
        <fieldset>
            <legend>Professional Information</legend>
            <ul>
                <li>
                    <span>Hobbies</span>
                    <input type="checkbox" name="Hobbies" id="reading">
                    <label for="reading">Reading</label>
                    <input type="checkbox" name="Hobbies" id="writing">
                    <label for="writing">Writing</label>
                    <input type="checkbox" name="Hobbies" id="singing">
                    <br>

                    <input type="checkbox" name="Hobbies" id="Chess">
                    <label for="Chess">Chess</label>
                    <input type="checkbox" name="Hobbies" id="Dancing">
                    <label for="Dancing">Dancing</label>
                    <input type="checkbox" name="Hobbies" id="Swimming">
                    <label for="Swimming">Swimming</label>
                    
                </li>
                <li>
                    <label for="Qualification">Qualification:</label>
                    <select name="Occupation" id="Qualification" required>
                        <option value="Bsc">Bsc</option>
                        <option value="Msc">Msc</option>
                        <option value="Phd">Phd</option>
                        <option value="HND">HND</option>
                        <option value="SSCE">SSCE</option>
                        </select>
                        
                        
                </li>
                <br>
                <li>
                    <input type="radio" name="Institution Attended" id="Institution Attended">
                    <placeholder for="Institution Attended">Institution Attended</placeholder>
                </li>
                <li></li>
            </ul>
        </fieldset>
</body>
</html>
